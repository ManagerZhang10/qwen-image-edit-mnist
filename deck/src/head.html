<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Diffusion 训练图解</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --faint:#A1A1A6; --line:#D2D2D7; --card:#FFFFFF;
  --accent:#0071E3;
  --font:"PingFang SC","SF Pro Display","SF Pro SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","Menlo","JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(1);transform-origin:center;background:var(--bg)}
.slide{position:absolute;inset:0;padding:92px 128px 96px;display:none;flex-direction:column}
.slide.active{display:flex}
/* 页眉三件套：小标 / 大标题 / 可选副标 */
.kicker{font-size:22px;font-weight:500;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.kicker b{color:var(--ink);font-weight:600;margin-right:14px}
h1{font-size:68px;font-weight:600;letter-spacing:-.012em;line-height:1.15;margin-top:20px}
h1 .thin{font-weight:400;color:var(--muted)}
h1 .acc{color:var(--accent)}
.sub{font-size:30px;color:var(--muted);margin-top:14px;font-weight:400;line-height:1.4}
/* 图 / 视频 */
.fig{flex:1;min-height:0;position:relative;margin-top:44px}
.fig img,.fig video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fig.card{background:var(--card);border-radius:26px;box-shadow:0 14px 48px rgba(0,0,0,.06)}
.fig.card img,.fig.card video{padding:30px}
.fig.plain img,.fig.plain video{border-radius:22px}
.fig.video{background:#000;border-radius:26px;overflow:hidden}
.fig.video video{background:#000}
.fig2{flex:1;min-height:0;display:flex;gap:30px;margin-top:44px}
.fig2 .fig{margin:0}
/* 图 / 视频网格；.ph 是裁切填满的单元（object-fit:cover） */
.grid2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:20px;margin-top:44px}
.grid4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr;gap:24px;margin-top:44px}
.ph{position:relative;border-radius:22px;overflow:hidden;background:#000}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.fit img,.ph.fit video{object-fit:contain}
.ph.white{background:#fff;box-shadow:0 14px 48px rgba(0,0,0,.06)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 24px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:28px;font-weight:600;line-height:1.3}
.ph .tag{position:absolute;left:18px;bottom:16px;background:rgba(29,29,31,.82);color:#fff;font-size:20px;padding:8px 14px;border-radius:10px;font-weight:500}
/* 满屏播片页 */
.slide.film{padding:0;background:#000}
.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.film .ov{position:absolute;left:50%;top:40px;transform:translateX(-50%);color:#fff;font-size:22px;letter-spacing:.14em;opacity:.8;z-index:2;white-space:nowrap}
/* 自绘图：白卡里的 svg。.pad 版留边并居中，图顶不到卡边 */
.diagbox{flex:1;min-height:0;position:relative;background:var(--card);border-radius:26px;box-shadow:0 14px 48px rgba(0,0,0,.06);margin-top:44px}
.diagbox svg{position:absolute;inset:0;width:100%;height:100%}
.diagbox.pad svg{inset:0;margin:auto;width:calc(100% - 88px);height:calc(100% - 68px)}
.sv text{font-family:"PingFang SC","Helvetica Neue",sans-serif}
.sv .mono{font-family:"SF Mono","Menlo",monospace}
/* 表 */
.tblwrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;background:var(--card);border-radius:26px;box-shadow:0 14px 48px rgba(0,0,0,.06);padding:40px 56px;margin-top:44px}
.fig2 .tblwrap{margin-top:0}
.tblwrap .tt{font-size:24px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:500;margin-bottom:26px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:32px;text-align:center}
.tbl th{font-size:24px;font-weight:500;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:0 0 18px;border-bottom:2px solid var(--line)}
.tbl td{padding:22px 0;border-bottom:1px solid var(--line);font-family:var(--mono)}
.tbl td:first-child{font-family:var(--mono);color:var(--muted)}
.tbl tr.hi td{color:var(--accent);font-weight:600}
.tbl tr.bad td{color:#D0342C}
.tbl.small{font-size:28px}
.tbl.small td{padding:18px 0}
.tbl.left{text-align:left}
.tbl.left th{text-align:left;padding-left:16px}
.tbl.left td{font-family:var(--font);font-size:27px;padding:16px 16px;line-height:1.35}
.tbl.left td:first-child{color:var(--ink);font-family:var(--font);font-weight:500}
.tbl.left td.ok{color:var(--accent);font-weight:600;font-family:var(--font)}
.tbl.left td.no{color:#D0342C;font-weight:600;font-family:var(--font)}
.tbl.left td:nth-child(2){white-space:nowrap;color:var(--muted)}
.tbl.left.compact td{font-size:25px;padding:13px 14px}
.tbl.left.wrap td:nth-child(2){white-space:normal;color:var(--ink)}
.tbl.left tr.hi td{color:var(--accent);font-weight:600}
.tbl.left.compact.cmp6 th{font-size:19px;letter-spacing:.02em;padding:0 10px 12px 10px}
.tbl.left.compact.cmp6 td{font-size:21px;padding:11px 10px;line-height:1.3}
.tbl.left.compact.cmp6 td:first-child{white-space:nowrap}
.tbl.num td{font-family:var(--mono);font-size:27px;padding:16px 10px}
.tbl.num td:first-child{font-family:var(--font);text-align:left;color:var(--ink);font-weight:500;padding-left:16px}
.tbl.num th:first-child{text-align:left;padding-left:16px}
.tbl.num td.acc{color:var(--accent);font-weight:600}
.tbl.num td.dim{color:var(--faint)}
.tbl.num.two td{padding:14px 10px;line-height:1.25}
.tbl.num.two td b{font-size:30px;font-weight:600}
.tbl.num.two td small{font-size:21px;color:var(--muted)}
.tbl.num.two td.acc small{color:var(--accent)}
.tbl.num.compact td{font-size:24px;padding:11px 8px;white-space:nowrap}
.tbl.num.compact th{padding-bottom:12px}
/* 数字卡（2×3 / 2×2 网格） */
.stats{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:44px;align-content:stretch}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border-radius:26px;box-shadow:0 14px 48px rgba(0,0,0,.06);padding:36px 40px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.stat .n{font-size:82px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--accent);white-space:nowrap}
.stat .n small{font-size:38px;color:var(--ink);margin-left:8px;font-weight:500}
.stat .l{font-size:25px;color:var(--muted);margin-top:16px;line-height:1.35}
.stat .l b{color:var(--ink);font-weight:600}
.stat.dim .n{color:var(--ink)}
.stat.text .n{font-size:44px;color:var(--ink);white-space:normal;line-height:1.2}
.stat.text .n .acc{color:var(--accent)}
/* 并排大卡 / 四步条 */
.cards{flex:1;min-height:0;display:flex;gap:32px;justify-content:center;align-items:center;margin-top:44px}
.card{flex:1;min-height:320px;display:flex;flex-direction:column;justify-content:center;background:var(--card);border-radius:30px;padding:54px 36px;box-shadow:0 14px 48px rgba(0,0,0,.06);text-align:center}
.card .big{font-size:64px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.card .big.mono{font-family:var(--mono);font-size:40px;letter-spacing:0}
.card .h{font-size:26px;color:var(--muted);margin-top:22px;line-height:1.45}
.steps{flex:1;min-height:0;display:flex;align-items:stretch;gap:24px;margin-top:44px}
.step{flex:1;background:var(--card);border-radius:30px;padding:48px 30px;box-shadow:0 14px 48px rgba(0,0,0,.06);text-align:center;display:flex;flex-direction:column;justify-content:center}
.step .n{font-family:var(--mono);font-size:22px;color:var(--accent);letter-spacing:.1em}
.step .t{font-size:42px;font-weight:600;margin-top:16px;line-height:1.25;letter-spacing:-.01em}
.step .s{font-size:26px;color:var(--muted);margin-top:14px;line-height:1.4}
.step.dim{background:transparent;box-shadow:none;border:2px solid var(--line)}
/* 时间线 */
.timeline{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 10px}
.tl-row{position:relative;display:flex;justify-content:space-between;padding-top:56px}
.tl-row:before{content:"";position:absolute;left:7%;right:7%;top:0;height:2px;background:var(--line)}
.tl{flex:1;text-align:center;position:relative}
.tl .dot{position:absolute;left:50%;top:-66px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--line)}
.tl.key .dot{background:var(--accent);box-shadow:0 0 0 10px rgba(0,113,227,.15)}
.tl .d{font-family:var(--mono);font-size:20px;color:var(--muted);letter-spacing:.06em}
.tl .n{font-size:38px;font-weight:600;margin-top:10px;letter-spacing:-.01em;line-height:1.15}
.tl.key .n{color:var(--accent)}
.tl.dim .n{color:var(--faint)}
.tl .w{font-size:22px;color:var(--muted);margin-top:12px;line-height:1.4;padding:0 12px}
/* 两列清单 */
.two{display:flex;gap:80px;flex:1;margin-top:48px;align-items:flex-start}
.two .col{flex:1}
.h2{font-size:22px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;font-weight:500}
.li{font-size:28px;line-height:1.45;padding:18px 0;border-top:1px solid var(--line)}
.li:last-child{border-bottom:1px solid var(--line)}
.li b{font-weight:600}
/* 一句一行的大字页 */
.bigline{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px}
.bigline .row{font-size:54px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.bigline .row .thin{font-weight:400;color:var(--muted)}
.bigline .row .acc{color:var(--accent)}
.bigline .row.small{font-size:36px;font-weight:400;color:var(--muted)}
/* 原话卡 */
.quotes{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px;margin-top:30px}
.quote{background:var(--card);border-radius:22px;box-shadow:0 14px 48px rgba(0,0,0,.06);padding:26px 40px}
.quote .q{font-size:34px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.quote .q .acc{color:var(--accent)}
.quote .src{font-size:20px;color:var(--muted);margin-top:10px}
/* 代码卡 */
.code2{flex:1;min-height:0;display:flex;gap:26px;margin-top:44px}
.code{flex:1;min-height:0;background:var(--card);border-radius:26px;box-shadow:0 14px 48px rgba(0,0,0,.06);padding:24px 32px;display:flex;flex-direction:column;overflow:hidden}
.code .tt{font-size:20px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:500;margin-bottom:12px}
.code pre{font-family:var(--mono);font-size:17px;line-height:1.36;white-space:pre;color:var(--ink);margin:0}
.code .k{color:var(--muted)} .code .n{color:var(--accent);font-weight:600} .code .c{color:var(--faint)}
/* 动画页（J / K 手动推进） */
.row{flex:1;min-height:0;display:flex;gap:30px;margin-top:44px}
.row.anim .diagbox{flex:1.75;margin-top:0}
.stepcol{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.step-item{display:flex;gap:16px;align-items:flex-start;padding:14px 18px;border-radius:18px;opacity:.38;transition:opacity .4s,background .4s}
.step-item.cur{opacity:1;background:var(--card);box-shadow:0 14px 48px rgba(0,0,0,.06)}
.step-item .sn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--line);color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step-item.cur .sn{background:var(--accent)}
.step-item .st{font-size:22px;line-height:1.4;color:var(--muted)}
.step-item .st b{display:block;color:var(--ink);font-weight:600;font-size:25px;margin-bottom:2px}
.step-item.cur .st{color:var(--ink)}
svg[data-anim] [data-a]{opacity:.08;transition:opacity .5s}
svg[data-anim] [data-a].on{opacity:1}
/* 封面 / 过渡 */
.cover{padding:0}
.cover .t{position:absolute;left:128px;top:150px}
.cover .kicker{font-size:24px}
.cover h1{font-size:230px;letter-spacing:-.035em;line-height:.95;margin-top:26px}
.cover .p{font-size:42px;color:var(--muted);margin-top:26px;font-weight:400;max-width:1560px;line-height:1.35}
.cover .p b{color:var(--ink);font-weight:600}
.cover .brand{position:absolute;right:128px;top:158px;font-size:26px;letter-spacing:.14em;color:var(--muted)}
.cover .photos{position:absolute;left:0;right:0;bottom:0;height:330px;display:flex;gap:6px;background:#000}
.cover .photos img{flex:1;min-width:0;height:100%;object-fit:cover;display:block}
.divider{justify-content:center}
.divider .num{font-family:var(--mono);font-size:26px;letter-spacing:.2em;color:var(--faint)}
.divider .word{font-size:160px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:18px}
.divider .word .thin{font-weight:400;color:var(--muted)}
/* 导航（左上角热区）——所有期通用，不要改 */
#nav-hot{position:fixed;left:0;top:0;width:220px;height:110px;z-index:20}
#nav-btn{position:fixed;left:14px;top:14px;height:44px;padding:0 14px 0 10px;border-radius:10px;background:rgba(29,29,31,.82);color:#fff;font-size:18px;font-family:var(--mono);display:flex;align-items:center;gap:10px;cursor:pointer;opacity:.22;transition:opacity .25s;z-index:21;user-select:none}
#nav-btn span.pg{font-size:18px;letter-spacing:.06em}
#nav-btn .b{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14)}
#nav-btn .b:hover{background:rgba(255,255,255,.3)}
#nav-hot:hover ~ #nav-btn,#nav-btn:hover,#nav-btn.open{opacity:1}
#nav-panel{position:fixed;left:14px;top:66px;width:440px;max-height:calc(100vh - 90px);overflow:auto;background:#fff;color:#1D1D1F;border:1px solid #D2D2D7;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.18);padding:8px;display:none;z-index:22;font-family:var(--font);font-size:14px}
#nav-panel.open{display:block}
#nav-panel .sec-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#6E6E73;padding:10px 10px 4px;text-transform:uppercase}
#nav-panel .it{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;cursor:pointer;line-height:1.35}
#nav-panel .it:hover{background:#F5F5F7}
#nav-panel .it.cur{background:#E8F0FE;color:#0071E3}
#nav-panel .it .k{font-family:var(--mono);font-size:12px;color:#6E6E73;min-width:24px;text-align:right}
#nav-panel .it.cur .k{color:#0071E3}
#hud{position:fixed;left:18px;bottom:14px;font-family:var(--mono);font-size:13px;color:#8e8e93;opacity:0;transition:opacity .6s;pointer-events:none;z-index:9}
#hud.show{opacity:1}
/* ===== 本 deck 追加 ===== */
/* 底部注释行（kelip-slide 模板 .talk + customize.md 右下角出处，限定 .slide>.src，避免影响 .code/.quote 卡内的 .src）：CSS 预留，目前没有页使用 */
.talk{margin-top:26px;padding:14px 22px;border-left:4px solid var(--line);font-size:19px;color:var(--muted);line-height:1.5;flex:none}
.talk b{color:var(--ink);font-weight:600}
.talk .acc{color:var(--accent);font-weight:600}
.slide>.src{position:absolute;right:128px;bottom:40px;font-family:var(--mono);font-size:18px;color:var(--faint);letter-spacing:.06em}
.kicker{text-transform:none}
.tbl th{text-transform:none}
.cards.analog{align-items:stretch;max-height:640px;align-self:center;width:100%}
.cards.analog .card{text-align:left;justify-content:flex-start;padding:52px 40px;gap:16px}
.cards.analog .tag{font-size:21px;color:var(--muted);letter-spacing:.08em;font-weight:500}
.cards.analog .big{font-size:50px}
.cards.analog .h{margin-top:4px;font-size:24px;line-height:1.55}
.cards.analog .h b{color:var(--ink);font-weight:600}
.cards.analog .out{font-family:var(--mono);font-size:23px;color:var(--ink);background:var(--bg);border-radius:12px;padding:12px 16px;margin-top:6px}
.cards.analog .warn{font-size:20px;color:var(--muted);line-height:1.5;margin-top:10px;padding-top:16px;border-top:1px solid var(--line)}
.cards.analog .card.hi{box-shadow:0 0 0 2px var(--accent),0 14px 48px rgba(0,0,0,.06)}
.cards.analog .card.hi .big,.cards.analog .card.hi .tag{color:var(--accent)}
.sym{font-family:var(--mono);font-size:.92em;color:var(--accent);background:#E8F0FE;border-radius:6px;padding:0 6px;white-space:nowrap}
.notes.tight{gap:14px}
.notes.tight .note{padding:16px 24px;font-size:21px}
.notes.tight .note b{font-size:24px}
.goto{cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.goto:hover{opacity:.75}
.split{flex:1;min-height:0;display:flex;gap:30px;margin-top:44px}
.split > .code{flex:1.45}
.split > .diagbox{margin-top:0}
.split > .fig{margin-top:0;flex:1.5}
.notes{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0}
.note{background:var(--card);border-radius:22px;box-shadow:0 14px 48px rgba(0,0,0,.06);padding:22px 28px;font-size:23px;line-height:1.45;color:var(--muted)}
.note b{color:var(--ink);display:block;font-size:27px;font-weight:600;margin-bottom:4px}
.note b .acc,.note .acc{color:var(--accent)}
.note code,.li code,.stat code,.card code{font-family:var(--mono);font-size:.9em;color:var(--ink);background:#F5F5F7;border-radius:6px;padding:1px 7px}
.code.lg pre{font-size:21px;line-height:1.5}
.code.md pre{font-size:19px;line-height:1.45}
.code .src{font-size:18px;color:var(--faint);margin-top:auto;padding-top:10px;font-family:var(--mono)}
/* 代码行 ↔ 右侧说明卡 配色联动：.hlN 标代码，.note.cN 标对应的卡 */
:root{--h1:#0071E3;--h1bg:rgba(0,113,227,.11);--h2:#E08600;--h2bg:rgba(255,149,0,.17);--h3:#1F9D48;--h3bg:rgba(52,199,89,.16);--h4:#A34FD6;--h4bg:rgba(175,82,222,.13)}
.code pre [class^="hl"]{border-radius:5px;padding:1px 3px;margin:0 -3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.code pre .hl1{background:var(--h1bg);box-shadow:inset 0 -2px 0 rgba(0,113,227,.35)}
.code pre .hl2{background:var(--h2bg);box-shadow:inset 0 -2px 0 rgba(224,134,0,.45)}
.code pre .hl3{background:var(--h3bg);box-shadow:inset 0 -2px 0 rgba(31,157,72,.4)}
.code pre .hl4{background:var(--h4bg);box-shadow:inset 0 -2px 0 rgba(163,79,214,.4)}
.code pre [class^="hl"] .c{color:#8E8E93}
.note.c1,.note.c2,.note.c3,.note.c4{position:relative}
.notes:has(.c1,.c2,.c3,.c4) .note{padding-left:36px}
.note.c1::before,.note.c2::before,.note.c3::before,.note.c4::before{content:"";position:absolute;left:16px;top:22px;bottom:22px;width:6px;border-radius:3px}
.note.c1::before{background:var(--h1)} .note.c2::before{background:var(--h2)} .note.c3::before{background:var(--h3)} .note.c4::before{background:var(--h4)}
.note.c1{background:linear-gradient(90deg,rgba(0,113,227,.05),#fff 60%)}
.note.c2{background:linear-gradient(90deg,rgba(255,149,0,.07),#fff 60%)}
.note.c3{background:linear-gradient(90deg,rgba(52,199,89,.07),#fff 60%)}
.note.c4{background:linear-gradient(90deg,rgba(175,82,222,.06),#fff 60%)}
.notes.tight:has(.c1,.c2,.c3,.c4) .note{padding-left:34px}
.notes.tight .note.c1::before,.notes.tight .note.c2::before,.notes.tight .note.c3::before,.notes.tight .note.c4::before{left:15px;top:16px;bottom:16px}
